name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable bundle (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
        env:
          SUPERDEV_REQUIRE_WINDOWS_HOOK: ${{ runner.os == 'Windows' && '1' || '0' }}

  scripts:
    name: Runtime tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/superdev/skills/superdev-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test orch watch-pr check-plan.test.ts

  pi-types:
    name: Pi adapter types and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: npm install -g --ignore-scripts --before=2026-10-11 @earendil-works/pi-coding-agent@1.1.0
      - run: bun install --frozen-lockfile
      - run: bun tools/typecheck-pi.mjs
      - run: bun test tests/pi/catalog.test.mjs tests/pi/runtime.test.mjs
        env:
          SUPERDEV_PI_REQUIRE_CATALOG: "1"
          SUPERDEV_PI_REQUIRE_RUNTIME: "1"
