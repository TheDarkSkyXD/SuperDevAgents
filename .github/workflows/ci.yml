name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable bundle (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
        env:
          SUPERDEV_REQUIRE_WINDOWS_HOOK: ${{ runner.os == 'Windows' && '1' || '0' }}

  scripts:
    name: Runtime tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/superdev/skills/superdev-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test orch watch-pr check-plan.test.ts

  pi-types:
    name: Pi adapter types and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: npm install -g --ignore-scripts --before=2026-10-11 @earendil-works/pi-coding-agent@1.1.0
      - run: bun install --frozen-lockfile
      - run: bun tools/typecheck-pi.mjs
      - run: bun test tests/pi/catalog.test.mjs tests/pi/runtime.test.mjs
        env:
          SUPERDEV_PI_REQUIRE_CATALOG: "1"
          SUPERDEV_PI_REQUIRE_RUNTIME: "1"

  statechart:
    name: Statechart scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/superdev/skills/statechart/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node the suite was measured on. It runs the TypeScript sources
      # directly, which needs Node 22.18, or 23.6 and later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # TLC_TOOL in run.ts pins the release and checksum the skill installs
      # with mise, so the job checks the same jar.
      - name: Download TLC
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          set -eo pipefail
          pin=$(node -e 'const [, sum, version] = require("fs").readFileSync("run.ts", "utf8").match(/const TLC_TOOL =\s*"[^"]*sha256:([0-9a-f]{64})\]@([^"]+)"/); console.log(version, sum);')
          read -r version sum <<< "$pin"
          curl --fail --location --output "$TLA2TOOLS" "https://github.com/tlaplus/tlaplus/releases/download/v$version/tla2tools.jar"
          echo "$sum  $TLA2TOOLS" | sha256sum --check
      # The render tests install Pele and Mermaid with npm under XDG_CACHE_HOME.
      - name: Test
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg
        run: JAVA="$(command -v java)" npm test
